app = "aptiverse-frontend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.frontend"
  [build.args]
    REACT_APP_API_URL = "https://aptiverse-backend.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory_mb = 256
