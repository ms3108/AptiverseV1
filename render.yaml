# Render Blueprint for Aptiverse V1
# This file tells Render how to deploy your application

services:
  # Backend Service (FastAPI)
  - type: web
    name: aptiverse-backend
    env: python
    runtime: python-3.11.0
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aptiverse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: WEAVIATE_URL
        value: http://localhost:8080
    
  # Frontend Service (React)
  - type: web
    name: aptiverse-frontend
    env: static
    region: singapore
    plan: free
    branch: main
    buildCommand: "cd frontend && npm install && REACT_APP_API_URL=$BACKEND_URL npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: aptiverse-backend
          property: url

  # Weaviate Vector Database (Docker)
  - type: web
    name: aptiverse-weaviate
    env: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.weaviate
    dockerContext: .
    envVars:
      - key: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
        value: true
      - key: PERSISTENCE_DATA_PATH
        value: /var/lib/weaviate
      - key: DEFAULT_VECTORIZER_MODULE
        value: none
      - key: CLUSTER_HOSTNAME
        value: node1

databases:
  # PostgreSQL Database
  - name: aptiverse-db
    plan: free
    databaseName: aptiverse
    user: aptiverse
